services:
  postgres:
    container_name: firestorm-pg
    # supabase/postgres: PostgreSQL 17 with pgvector (semantic search). Its
    # superuser is supabase_admin (don't set POSTGRES_USER or POSTGRES_DB:
    # its init scripts rely on the defaults); POSTGRES_PASSWORD also sets
    # the password of the `postgres` role Firefly connects as, which can
    # create the database and the extension. Only the database image: no
    # other Supabase services.
    image: supabase/postgres:17.11.0.018
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the first start initialises under a socket-only server.
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

  firestorm:
    container_name: firestorm
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 4000:4000
    volumes:
      - .:/firestorm
      - /firestorm/deps
      - /firestorm/_build
      - /firestorm/apps/firefly_web/assets/node_modules
    command: bash -c "mix deps.get && npm ci --prefix apps/firefly_web/assets && mix ecto.create && mix ecto.migrate && mix phx.server"
    environment:
      FIREFLY_POSTGRES_USER: postgres
      FIREFLY_POSTGRES_PASSWORD: postgres
      FIREFLY_POSTGRES_HOST: postgres
      FIREFLY_POSTGRES_PORT: 5432

volumes:
  pgdata:
