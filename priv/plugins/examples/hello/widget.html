<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; color: #666; }
    </style>
  </head>
  <body>
    <p id="views">…</p>
    <script src="/plugins/sdk.js"></script>
    <script>
      Firefly.ready(() => {
        Firefly.call("view").then(({views, greeting}) => {
          document.getElementById("views").textContent = `${greeting} This widget was seen ${views} times.`;
          Firefly.resize(48);
        });
      });
    </script>
  </body>
</html>
