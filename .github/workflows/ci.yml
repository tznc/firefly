name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1.2"
  NODE_VERSION: "26.13.0"
  # Image uploads: Vix builds against the libvips installed below.
  VIX_COMPILATION_MODE: PLATFORM_PROVIDED_LIBVIPS

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    services:
      postgres:
        # supabase/postgres: PostgreSQL 17 with pgvector (semantic search).
        # Its superuser is supabase_admin (leave POSTGRES_USER alone: its
        # init scripts rely on it); POSTGRES_PASSWORD also sets the password
        # of the `postgres` role the tests connect as, which isn't a
        # superuser but can create databases and (through supautils)
        # extensions. On first start it runs its own migrations under a
        # temporary socket-only server, so the health check goes over TCP.
        image: supabase/postgres:17.11.0.018
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # The importers' source databases (see apps/firefly_import's tests
      # tagged import_mysql, import_mongo and import_redis).
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # MongoDB 7: 8.0 refuses to start on the runners' Linux 6.19 kernels
      # (SERVER-121912).
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval db.hello"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
      # A directory for the LDAP login tests (tagged ldap; see
      # Firefly.LDAPTestDirectory).
      ldap:
        image: ghcr.io/rroemhild/docker-test-openldap@sha256:d402f9a21a1d071db43b321ab2e304ee7945c1d8162c9c496fbedbda9ffe58a5
        ports: ["10389:10389", "10636:10636"]
        # The image's own health check searches the admin DN, which isn't an
        # entry, so it never passes: check the last entry it bootstraps.
        options: >-
          --health-cmd "ldapsearch -x -H ldap://127.0.0.1:10389 -D cn=admin,dc=planetexpress,dc=com -w GoodNewsEveryone -b cn=ship_crew,ou=people,dc=planetexpress,dc=com -s base dn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      # Backup tests run pg_dump/pg_restore, which must be at least the
      # server's major version (17); 18 is what the release image ships.
      - name: Install postgresql-client-18
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/firefly_web/assets/package-lock.json

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Check the plugin runtime against its checksum
        run: cd apps/firefly_plugins/priv/plugins && sha256sum -c quickjs.wasm.sha256

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix compile --force --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo
      - run: mix hex.audit

      - name: Build assets
        run: |
          npm ci --prefix apps/firefly_web/assets
          mix assets.setup
          mix assets.build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/firefly_web/assets/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx --prefix apps/firefly_web/assets playwright install chromium --with-deps

      # Every app's tests: unit, LiveView (PhoenixTest) and end-to-end browser
      # (PhoenixTest.Playwright) tests, and the importers' against the
      # source databases and the directory above, and two nodes clustering
      # through Postgres
      - run: mix test --include import_mysql --include import_mongo --include import_redis --include ldap --include cluster

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Cache deps, _build and PLTs
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: dialyzer-dev-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: dialyzer-dev-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get
        env:
          MIX_ENV: dev
      - run: mkdir -p priv/plts
      - run: mix dialyzer --format github
        env:
          MIX_ENV: dev

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: firefly:ci
          build-args: FIREFLY_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the release boots
        # runtime.exs requires these (mail too: SMTP checks its TLS setup builds);
        # eval doesn't start the app, so dummies suffice
        run: |
          docker run --rm \
            -e FIREFLY_DATABASE_URL=ecto://user:pass@localhost/firefly \
            -e FIREFLY_SECRET_KEY_BASE="$(openssl rand -base64 48)" \
            -e FIREFLY_MAIL_ADAPTER=smtp -e FIREFLY_SMTP_RELAY=smtp.example.com \
            firefly:ci /app/bin/firefly eval 'IO.puts(Application.spec(:firefly_web, :vsn))'
          # Backups need PostgreSQL client tools at least as new as the server (17).
          docker run --rm --entrypoint /usr/lib/postgresql/18/bin/pg_restore firefly:ci --version
